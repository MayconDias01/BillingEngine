name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore

      - name: Check Vulnerable Packages
        run: dotnet list package --vulnerable --include-transitive

  docker:
    needs: [build-test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -t billing-api:${{ github.sha }} -f src/BillingEngine.API/Dockerfile .

      - name: Build Worker Image
        run: docker build -t billing-worker:${{ github.sha }} -f src/BillingEngine.Worker/Dockerfile .

      - name: Trivy Scan API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: billing-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Trivy Scan Worker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: billing-worker:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API
        run: |
          docker tag billing-api:${{ github.sha }} ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          docker tag billing-api:${{ github.sha }} ghcr.io/${{ github.repository }}/api:latest
          docker push ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/api:latest

      - name: Push Worker
        run: |
          docker tag billing-worker:${{ github.sha }} ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          docker tag billing-worker:${{ github.sha }} ghcr.io/${{ github.repository }}/worker:latest
          docker push ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/worker:latest
