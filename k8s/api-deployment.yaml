apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: billing-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: billing-api
          image: ghcr.io/billing-engine/api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: billing-engine-config
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: billing-engine-secrets
                  key: DB_PASSWORD
            - name: Encryption__Key
              valueFrom:
                secretKeyRef:
                  name: billing-engine-secrets
                  key: AES_KEY
            - name: Auth__CertPassword
              valueFrom:
                secretKeyRef:
                  name: billing-engine-secrets
                  key: CERT_PASSWORD
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: billing-engine-secrets
                  key: RABBITMQ_PASS
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
